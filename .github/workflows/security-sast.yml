name: SAST - Semgrep

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Semgrep
        run: |
          python3 -m pip install semgrep==1.177.0
          semgrep --version

      - name: Create report directory
        run: mkdir -p security/reports

      - name: Run Semgrep SAST
        run: |
          semgrep scan \
            --config p/default \
            --config p/github-actions \
            --oss-only \
            --error \
            --sarif-output security/reports/semgrep.sarif \
            .

      - name: Upload Semgrep report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: semgrep-sast-report
          path: security/reports/semgrep.sarif
          retention-days: 30

      - name: Upload results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          sarif_file: security/reports/semgrep.sarif
          category: semgrep