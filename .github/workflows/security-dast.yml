name: DAST - OWASP ZAP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-full-scan:
    name: ZAP Full Scan
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create ZAP report directory
        run: |
          mkdir -p security/reports
          chmod 777 security/reports

      - name: Create DAST Docker network
        run: |
          docker network create dast-network

      - name: Start OWASP Juice Shop
        run: |
          docker run -d \
            --name juice-shop \
            --network dast-network \
            -p 3000:3000 \
            bkimminich/juice-shop:v20.2.0

      - name: Wait for Juice Shop
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
          done

          echo "Juice Shop failed to start."
          docker logs juice-shop
          exit 1

      - name: Verify ZAP container can reach Juice Shop
        run: |
          docker run --rm \
            --network dast-network \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            python -c "import urllib.request; response=urllib.request.urlopen('http://juice-shop:3000'); print('HTTP status:', response.status)"

      - name: Run ZAP full scan
        run: |
          set -o pipefail

          docker run --rm \
            --network dast-network \
            -v "${{ github.workspace }}/security/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-full-scan.py \
            -t http://juice-shop:3000 \
            -m 3 \
            -I \
            -d \
            -r zap-full.html \
            -J zap-full.json \
            -w zap-full.md \
            2>&1 | tee security/reports/zap-full-console.log

      - name: List generated ZAP reports
        if: always()
        run: |
          echo "Generated files:"
          ls -lah security/reports || true

      - name: Upload ZAP scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-full-scan-report
          path: |
            security/reports/zap-full.html
            security/reports/zap-full.json
            security/reports/zap-full.md
            security/reports/zap-full-console.log
          if-no-files-found: warn
          retention-days: 30

      - name: Display Juice Shop logs on failure
        if: failure()
        run: |
          docker logs juice-shop || true

      - name: Cleanup DAST environment
        if: always()
        run: |
          docker rm -f juice-shop || true
          docker network rm dast-network || true