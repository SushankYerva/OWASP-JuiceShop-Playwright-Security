name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create authentication directory
        run: mkdir -p playwright/.auth

      - name: Start test application
        run: |
          docker run --detach \
            --name juice-shop \
            --publish 127.0.0.1:3000:3000 \
            bkimminich/juice-shop

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application: $attempt/30"
            sleep 2
          done

          docker logs juice-shop
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/html/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Show application logs
        if: failure()
        run: docker logs juice-shop