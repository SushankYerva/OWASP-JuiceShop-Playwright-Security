name: Playwright Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/security-*.yml'
      - '.github/dependabot.yml'
      - 'security/**'
      - 'docs/**'
      - '**/*.md'

  pull_request:
    paths-ignore:
      - '.github/workflows/security-*.yml'
      - '.github/dependabot.yml'
      - 'security/**'
      - 'docs/**'
      - '**/*.md'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ !(github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/github_actions/')) }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create authentication directory
        run: mkdir -p playwright/.auth

      - name: Start test application
        run: |
          docker run --detach \
            --name juice-shop \
            --publish 127.0.0.1:3000:3000 \
            bkimminich/juice-shop

      - name: Wait for application
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application: $attempt/30"
            sleep 2
          done

          docker logs juice-shop
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: reports/html/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-failure-evidence
          path: |
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Show application logs
        if: failure()
        run: docker logs juice-shop