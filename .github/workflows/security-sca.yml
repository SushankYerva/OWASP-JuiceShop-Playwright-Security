name: SCA - Dependency Security

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    if: ${{ !(github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/github_actions/')) }}

    name: npm Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create report directory
        run: mkdir -p security/reports

      - name: Generate npm audit report
        run: |
          npm audit --json > security/reports/npm-audit.json || true

      - name: Enforce dependency security gate
        run: npm audit --audit-level=high

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: security/reports/npm-audit.json
          retention-days: 30

  dependency-review:
    if: ${{ github.event_name == 'pull_request' && !(github.actor == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/github_actions/')) }}

    name: Dependency Review
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high