name: Container Security - Trivy

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  framework-security:
    name: Framework Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Create report directory
        run: mkdir -p security/reports

      - name: Scan framework repository
        run: |
            trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --skip-dirs playwright/.auth \
            --skip-dirs node_modules \
            --skip-dirs test-results \
            --skip-dirs playwright-report \
            --exit-code 1 \
            --format table \
            .

      - name: Generate framework SARIF report
        if: always()
        run: |
            trivy fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --skip-dirs playwright/.auth \
            --skip-dirs node_modules \
            --skip-dirs test-results \
            --skip-dirs playwright-report \
            --format sarif \
            --output security/reports/trivy-framework.sarif \
            .

      - name: Upload framework Trivy artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-framework-report
          path: security/reports/trivy-framework.sarif
          retention-days: 30

      - name: Upload Trivy results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: security/reports/trivy-framework.sarif
          category: trivy-framework


  juice-shop-container:
    name: Juice Shop Container Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Create report directory
        run: mkdir -p security/reports

      - name: Scan Juice Shop image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            bkimminich/juice-shop:latest || true

      - name: Generate Juice Shop JSON report
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output security/reports/trivy-juice-shop.json \
            bkimminich/juice-shop:latest

      - name: Upload Juice Shop container report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-juice-shop-container-report
          path: security/reports/trivy-juice-shop.json
          retention-days: 30