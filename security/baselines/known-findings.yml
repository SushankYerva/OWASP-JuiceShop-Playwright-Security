version: 1

target:
  name: "OWASP Juice Shop"
  purpose: "Intentionally vulnerable application used as the system under test"

policy:
  framework_findings:
    description: >
      Security findings introduced by the Playwright automation framework,
      repository configuration, dependencies, or CI/CD configuration are
      treated as regressions and may fail CI.

  target_findings:
    description: >
      Known vulnerabilities intentionally present in OWASP Juice Shop are
      documented and baselined so they remain visible without permanently
      failing CI.

  new_findings:
    description: >
      New security findings that are not part of the approved baseline must
      be reviewed before being accepted.

